<!DOCTYPE html>

<head>
  <meta charset="UTF-8" />

  <!-- ==================================================================
       CHANGES FROM YOUR OLD index.html
       1. REMOVED <meta name="keywords">. Google has ignored it since 2009,
          and yours contained "thesis writing service" -- a service you do
          not offer and should not be associated with. Universities treat
          thesis writing as academic misconduct.
       2. REMOVED the "Jodhpur's #1" claim. Unsubstantiated superlatives are
          what the Consumer Protection Act 2019 targets. Specific numbers
          convert better anyway.
       3. og:image now points at a proper 1200x630 card (see TODO below).
       4. Added sameAs so Google links your social profiles to the business.
       5. Added FAQ structured data -- this can win rich results for
          questions like "thesis binding cost Jodhpur".
       ================================================================== -->

  <title>Acadmify — Thesis Printing &amp; Hardbound Binding in Jodhpur</title>

  <meta name="description" content="Thesis printing and hardbound binding in Jodhpur. 200+ theses delivered for IIT Jodhpur, AIIMS, JNVU and MBM scholars. B&amp;W from Rs.2 per page, hardbound Rs.250, free doorstep delivery in 24-48 hours." />

  <link rel="canonical" href="https://acadmify.com/" />
  <meta name="robots" content="index, follow" />
  <meta name="author" content="Acadmify — Hari Om Graphics, Jodhpur" />
  <meta name="theme-color" content="#7A1E1E" />

  <!-- Keep your existing verification token -->
  <meta name="google-site-verification" content="GO4q-z-Sfk9Mg1coK3-4vc-_3MD1GadATkK8ByUmXiY" />

  <!-- TODO: update these to the exact coordinates Google shows for your
       verified Business Profile. The old values pointed at central Jodhpur,
       not Chopasni Housing Board. -->
  <meta name="geo.region" content="IN-RJ" />
  <meta name="geo.placename" content="Jodhpur, Rajasthan, India" />
  <meta name="geo.position" content="26.2789;73.0143" />
  <meta name="ICBM" content="26.2789, 73.0143" />

  <!-- Social sharing. TODO: make a real 1200x630 image called og-image.jpg
       and put it in the public folder. Most of your sharing happens on
       WhatsApp, where a stretched logo looks like a low-effort business. -->

  <meta property="og:site_name" content="Acadmify" />
  <meta property="og:locale" content="en_IN" />
  <meta property="og:url" content="https://acadmify.com/" />

  <meta name="twitter:card" content="summary_large_image" />

  <meta name="twitter:image" content="https://acadmify.com/og-image.jpg" />

  <meta name="mobile-web-app-capable" content="yes" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />

    href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=DM+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />

    "priceRange": "Rs.250-Rs.5000",
    "currenciesAccepted": "INR",
    "paymentAccepted": "Cash, UPI, Card, Net Banking",
    "address": {
      "@type": "PostalAddress",
      "streetAddress": "Sector 19 Circle, Chopasni Housing Board",
      "addressLocality": "Jodhpur",
      "addressRegion": "Rajasthan",
      "postalCode": "342008",

    },

      "latitude": 26.2789,
      "longitude": 73.0143
    },
    "areaServed": [

      { "@type": "Place", "name": "IIT Jodhpur" },

      "name": "Printing and binding services",

        { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Black and white thesis printing" }, "price": "2", "priceCurrency": "INR", "unitText": "per page" },
        { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Colour thesis printing" }, "price": "10", "priceCurrency": "INR", "unitText": "per page" },
        { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Hardbound thesis binding" }, "price": "250", "priceCurrency": "INR", "unitText": "per copy" }

  <!-- ================= FAQ =================
       These questions match what people actually search. Keep the answers
       accurate: Google penalises FAQ markup that is not on the page, so make
       sure a matching FAQ section exists on your homepage.
       ====================================== -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "FAQPage",
    "mainEntity": [
      {
        "@type": "Question",
        "name": "How much does thesis printing and hardbound binding cost in Jodhpur?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Black and white printing is Rs.2 per page and colour is Rs.10 per page. Hardbound binding is Rs.250 per copy. A typical 200-page single-copy PhD thesis works out to roughly Rs.767 including GST, with free delivery within Jodhpur."
        }
      },
      {
        "@type": "Question",
        "name": "How long does thesis printing take?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Standard orders within Jodhpur are delivered within 24 to 48 hours of payment confirmation. Large or colour-heavy orders take 2 to 4 days."
        }
      },
      {
        "@type": "Question",
        "name": "Is my unpublished thesis kept confidential?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Yes. Your file is stored in encrypted, access-restricted storage and opened only to print your order. We never read, copy, share or reuse your work, and files are permanently deleted 30 days after delivery."
        }
      },
      {
        "@type": "Question",
        "name": "Do you deliver to IIT Jodhpur and AIIMS Jodhpur campuses?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Yes. We deliver free to IIT Jodhpur, AIIMS Jodhpur, JNVU, MBM University and FDDI campuses, and anywhere else within Jodhpur city limits."
        }
      },
      {
        "@type": "Question",
        "name": "What cover colours are available for hardbound thesis binding?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Twelve cover colours are available: maroon, navy, black, forest green, brown, royal blue, pink, orange, purple, teal, grey and wine, with gold foil lettering."
        }
      }
    ]
  }
  </script>
